
name: Extract CNC Simulator ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "File ZIP tidak ditemukan!"
            exit 1
          fi

          EXTRACT_DIR="$RUNNER_TEMP/cnc-project"
          mkdir -p "$EXTRACT_DIR"

          unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"

          mapfile -t ITEMS < <(
            find "$EXTRACT_DIR" -mindepth 1 -maxdepth 1 -print
          )

          SOURCE_DIR="$EXTRACT_DIR"

          if [ "${#ITEMS[@]}" -eq 1 ] && [ -d "${ITEMS[0]}" ]; then
            SOURCE_DIR="${ITEMS[0]}"
          fi

          rsync -a \
            --exclude='.github/workflows/' \
            "$SOURCE_DIR/" ./

          rm -f "$ZIP_FILE"

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'

          git add -A
          git reset -- '.github/workflows'

          if git diff --cached --quiet; then
            echo "Tidak ada perubahan."
            exit 0
          fi

          git commit -m "Extract CNC Simulator project"
          git push
