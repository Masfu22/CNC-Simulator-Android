plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cncsmartgen.simulator'
    compileSdk 36

    defaultConfig {
        applicationId 'com.cncsmartgen.simulator'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.23.0-android1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.14.0'
}
